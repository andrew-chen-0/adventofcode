plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.ojalgo:ojalgo:54.0.0'
    implementation 'com.google.ortools:ortools-java:9.8.3296'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'com.adventofcode.Main'
}

tasks.register('runLeetCode', JavaExec) {
    group = 'application'
    description = 'Runs the LeetCode problem runner.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.leetcode.Main'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

test {
    useJUnitPlatform()
}
